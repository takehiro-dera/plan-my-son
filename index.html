<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ひなたの予定">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EAF1FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1330" media="(prefers-color-scheme: dark)">
<title>ひなたの予定</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>

:root{
--bg:#EAF1FF;--dots:rgba(20,33,61,.08);--surface:#FFFFFF;--surface2:#F1F5FF;--ink:#14213D;--ink2:#475B86;--line:#C9D5F2;--line2:#8FA3D1;--edge:#14213D;--cur:#14213D;
--err:#C4162A;--err-bg:#FFE3E6;
--okb:#E7EBF8;--bline:#14213D;--bink:#14213D;--bpt:#14213D;--bon:#EAF1FF;
--hero:#F03A3A;--hero-d:#B81D24;--hero-t:#B81D24;--hero-l:#FBCBCB;--hero-m:#F7A3A3;--hero-ok:#FDE3E3;--on-hero:#FFFFFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
--bg:#0B1330;--dots:rgba(255,255,255,.06);--surface:#1B2750;--surface2:#243366;--ink:#F2F6FF;--ink2:#AFC0EE;--line:#34467F;--line2:#6179C4;--edge:#050A1C;--cur:#FFD54F;
--err:#FFB3BF;--err-bg:#5A2431;
--okb:#2A3A72;--bline:#8FA3D1;--bink:#F2F6FF;--bpt:#F2F6FF;--bon:#0B1330;
}
}
:root[data-theme="dark"]{
--bg:#0B1330;--dots:rgba(255,255,255,.06);--surface:#1B2750;--surface2:#243366;--ink:#F2F6FF;--ink2:#AFC0EE;--line:#34467F;--line2:#6179C4;--edge:#050A1C;--cur:#FFD54F;
--err:#FFB3BF;--err-bg:#5A2431;
--okb:#2A3A72;--bline:#8FA3D1;--bink:#F2F6FF;--bpt:#F2F6FF;--bon:#0B1330;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;font-weight:700;
-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cur);outline-offset:2px}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
background:radial-gradient(circle,var(--dots) 1.6px,transparent 2.1px) 0 0/14px 14px,linear-gradient(180deg,var(--hero-l) 0,var(--bg) 380px),var(--bg)}
.app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:12px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
h1{margin:0;font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;font-weight:400;font-size:28px;line-height:1.2;letter-spacing:.02em;color:var(--ink);text-shadow:2px 2px 0 var(--hero)}
.date{font-size:14px;color:var(--ink2);margin-top:4px;font-weight:700}
.tools{display:flex;gap:10px;align-items:flex-start}
.gearwrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.hint{font-size:11px;color:var(--ink2);line-height:1}
.iconbtn{width:48px;height:48px;border-radius:12px;border:3px solid var(--edge);background:var(--surface);box-shadow:3px 3px 0 var(--edge);font-size:22px;cursor:pointer;display:grid;place-items:center;transition:transform .12s,box-shadow .12s}
.iconbtn.pressing{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 16px}
.tab{position:relative;overflow:hidden;border:3px solid var(--edge);border-radius:12px;background:var(--surface);color:var(--ink);padding:13px 0 6px;font-weight:900;font-size:17px;box-shadow:2px 2px 0 var(--edge);display:flex;flex-direction:column;align-items:center;min-height:80px;cursor:pointer}
.tab::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--tc)}
.tab .an{font-size:22px;line-height:1.15}
.tab .dn{font-size:12px;font-weight:700;line-height:1.2;opacity:.85}
.tab[aria-selected="true"]{background:var(--tc);color:var(--ton);box-shadow:4px 4px 0 var(--edge);transform:translateY(-2px)}
.tab[aria-selected="true"]::before{background:var(--tcd)}
.tab .dot{position:absolute;top:11px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--edge)}
.tab[aria-selected="true"] .dot{background:var(--ton)}
.ringwrap{width:min(100%,440px);margin:0 auto}
svg.ring{display:block;width:100%;height:auto;overflow:visible}
.track{fill:none;stroke:var(--surface2)}
.hub{fill:var(--hero-ok);stroke:var(--edge);stroke-width:2.5}
.ray{fill:var(--hero-l);opacity:.9}
.sg{stroke:var(--edge);stroke-width:2.5;stroke-linejoin:round;cursor:pointer}
.sg.a{fill:var(--hero-l)}
.sg.b{fill:var(--hero-m)}
.sg.dn{fill:var(--hero)}
.sg.cur{stroke:var(--cur);stroke-width:5;animation:pulse 1.6s ease-in-out infinite}
.lbl{font-size:13px;fill:var(--ink2);text-anchor:middle;font-weight:900}
.emo{font-size:26px;text-anchor:middle;pointer-events:none}
.cntbg{fill:var(--surface);stroke:var(--edge);stroke-width:2.5}
.cnt{font-size:17px;font-weight:900;fill:var(--ink);text-anchor:middle}
.bk{stroke-width:1.6;stroke-linejoin:round}
.bk.on{fill:var(--hero);stroke:var(--edge)}
.bk.off{fill:none;stroke:var(--line2)}
.bk.w{fill:#fff;stroke:var(--edge)}
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.jump{animation:jump .6s ease-out}
.bubble{margin:8px auto 14px;max-width:520px;background:var(--surface);border:3px solid var(--edge);border-radius:16px;padding:12px 18px;text-align:center;box-shadow:4px 4px 0 var(--edge);font-size:20px;font-weight:900;line-height:1.35}
.bubble small{display:block;font-size:15px;color:var(--ink2);font-weight:700;margin-top:2px}
.hearts{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;margin:0 0 14px}
.task{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:3px solid var(--edge);border-radius:16px;padding:10px 14px;margin:0 0 12px;box-shadow:4px 4px 0 var(--edge);min-height:76px;cursor:pointer;color:var(--ink)}
.task.cur{outline:4px solid var(--hero);outline-offset:2px}
.task.done{background:var(--hero-ok)}
.task:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--edge)}
.ic{width:54px;height:54px;border-radius:14px;background:var(--surface2);border:2px solid var(--line);display:grid;place-items:center;font-size:30px;flex:none}
.nm{flex:1;font-size:21px;font-weight:900;line-height:1.25}
.tm{display:block;font-size:14px;color:var(--ink2);font-weight:700;margin-top:2px}
.ck{width:48px;height:48px;flex:none}
.pcard{background:var(--surface);border:3px solid var(--edge);border-radius:16px;padding:14px 16px;margin:0 0 16px;box-shadow:4px 4px 0 var(--edge)}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ptotal{display:flex;align-items:baseline;gap:6px}
.ptotal .pst{font-size:26px}
.ptotal b{font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;font-weight:400;font-size:44px;line-height:1;color:var(--hero-t)}
.ptotal small{font-size:14px;color:var(--ink2)}
.pnext{text-align:right;font-size:15px;color:var(--ink2);line-height:1.45}
.pnext b{color:var(--ink);font-size:17px}
.pbar{height:18px;border:3px solid var(--edge);border-radius:9px;background:var(--surface2);margin:10px 0 12px;overflow:hidden}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--hero) 0 9px,var(--hero-d) 9px 18px);transition:width .6s}
.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.stp{height:38px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:900;color:var(--ink2);border:2px dashed var(--line2);background:var(--surface2)}
.stp.on{border:2px solid var(--edge);background:var(--hero-ok);font-size:18px}
.stp.cur{outline:3px solid var(--hero);outline-offset:1px}
.rhead{font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;font-weight:400;font-size:19px;margin:6px 4px 10px}
.rw{display:flex;align-items:center;gap:14px;background:var(--surface);border:3px solid var(--edge);border-radius:14px;padding:10px 14px;margin:0 0 10px;box-shadow:3px 3px 0 var(--edge);opacity:.78}
.rw.got{opacity:1;background:var(--hero-ok)}
.rs{font-size:14px;font-weight:900;color:var(--ink2);white-space:nowrap}
.rs.g{color:var(--on-hero);background:var(--hero);border:2px solid var(--edge);border-radius:10px;padding:6px 12px}
.erow input[type="number"]{width:84px}
.erow input[type="checkbox"]{width:22px;height:22px;padding:0}
.claim{display:flex;align-items:center;gap:6px;font-size:14px}
.cpt{margin-top:10px;display:grid;gap:6px;font-size:16px;color:var(--ink2)}
.cp1{font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;font-weight:400;font-size:24px;color:var(--hero-t)}
.cp2{font-size:18px;font-weight:900;color:var(--ink);background:var(--hero-ok);border:2px solid var(--edge);border-radius:12px;padding:8px}
.tabsx{margin:0 0 10px}
.empty{text-align:center;color:var(--ink2);padding:18px 8px;font-size:17px}
.panel{background:var(--surface);border:3px solid var(--edge);border-radius:16px;padding:14px;box-shadow:4px 4px 0 var(--edge);margin:0 0 12px}
.panel h2{margin:0 0 4px;font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;font-weight:400;font-size:20px}
.panel p{margin:0 0 12px;font-size:14px;color:var(--ink2)}
.erow{background:var(--surface2);border-radius:14px;padding:10px;margin:0 0 8px;border:2px solid transparent}
.erow.bad{border-color:var(--err)}
.e1,.e2{display:flex;align-items:center;gap:8px}
.e2{margin-top:8px;flex-wrap:wrap;color:var(--ink2);font-size:15px}
.erow input,.erow select{font-size:17px;padding:9px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);min-width:0}
.erow select{width:68px;flex:none;font-size:22px;padding:6px}
.erow input[type="text"]{flex:1}
.erow input[type="time"]{width:150px}
.x{width:42px;height:42px;border-radius:10px;border:0;background:var(--err-bg);color:var(--err);font-size:18px;cursor:pointer;flex:none}
.errs{background:var(--err-bg);color:var(--err);border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:15px;font-weight:900;display:none}
.errs.on{display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:3px solid var(--edge);border-radius:12px;padding:11px 18px;font-weight:900;font-size:17px;cursor:pointer;background:var(--hero);color:var(--on-hero);box-shadow:3px 3px 0 var(--edge);min-height:48px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn.sec{background:var(--surface2);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.chip{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 14px;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink2);min-height:44px}
.chip[aria-pressed="true"]{background:var(--hero);border-color:var(--edge);color:var(--on-hero)}
.sub{font-size:14px;color:var(--ink2);margin:14px 0 0;font-weight:900}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:900;font-size:16px;z-index:70;display:none;max-width:90vw;text-align:center}
.toast.on{display:block}
.cele{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,10,28,.62);z-index:50;padding:20px}
.cele.on{display:grid}
.celecard{background:var(--surface);border:3px solid var(--edge);border-radius:20px;padding:22px 26px 26px;text-align:center;box-shadow:6px 6px 0 var(--hero);max-width:340px;width:100%}
.celecard svg{width:200px;height:200px;display:block;margin:0 auto}
.celecard b{display:block;font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;font-weight:400;font-size:24px;margin-top:6px;line-height:1.25;text-wrap:balance}
.celecard small{display:block;font-size:16px;color:var(--ink2);margin-top:6px;font-weight:700}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16px) scale(1.06)}70%{transform:translateY(0) scale(.97)}100%{transform:translateY(0) scale(1)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.foot{font-size:11px;color:var(--ink2);text-align:center;margin:14px 0 0;opacity:.9}
.panel textarea{width:100%;min-height:120px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;color:var(--ink);resize:vertical}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0 0 10px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-weight:900}
.note{font-size:13px;color:var(--ink2);margin:8px 0 0}
.chk{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:16px}
.chk input{width:24px;height:24px}

.prow{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.prow .pcard{margin:0;flex:1 1 280px}
.bcard{background:var(--okb)}
.bcard .ptotal b{color:var(--ink)}
.bcard .pnext b{color:var(--ink)}
.bcard .pbar{background:var(--surface)}
.bcard .pbar i{background:repeating-linear-gradient(-45deg,var(--bpt) 0 9px,var(--bline) 9px 18px)}
.bsec{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:18px 4px 10px;font-size:17px;font-weight:900}
.bchip{font-size:13px;padding:3px 11px;border-radius:8px;background:var(--bpt);color:var(--bon);font-weight:900;letter-spacing:.04em}
.task.bonus{border-style:dashed}
.task.bonus.done{background:var(--okb);border-style:solid}
.bpp{font-size:15px;font-weight:900;color:var(--bink);background:var(--okb);border:2px solid var(--bline);border-radius:10px;padding:4px 10px;white-space:nowrap;flex:none}
.task.bonus.done .bpp{background:var(--bpt);color:var(--bon);border-color:var(--bpt)}
.bkc.on{fill:var(--bpt);stroke:var(--edge)}
.bkc.off{fill:none;stroke:var(--bline)}
.bkp{fill:none;stroke:var(--bon);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.rw.brw.got{background:var(--okb)}
.rw.brw .rs.g{background:var(--bpt);color:var(--bon)}
.bsum{font-size:14px;color:var(--ink2);margin:0 4px 14px;font-weight:700}
.ptotal small{white-space:nowrap}
.pnext{min-width:0}
.sinp{width:100%;margin:0 0 8px;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:14px;color:var(--ink)}
</style>
</head>
<body>
<div class="deco" aria-hidden="true" id="deco"></div>
<div class="app">
<div class="top">
<div><h1>ひなたの予定</h1><div class="date" id="date"></div></div>
<div class="tools">
<button class="iconbtn" id="mute" aria-label="おとのオンオフ">🔔</button>
<div class="gearwrap"><button class="iconbtn" id="gear" aria-label="おうちの方へ（ながおし）">⚙️</button><span class="hint">ながおし</span></div>
</div>
</div>
<div class="tabs" id="tabs" role="tablist" aria-label="ようび"></div>
<div class="ringwrap"><svg class="ring" id="ring" viewBox="-10 -10 420 420" role="img" aria-label="じかんわりの とけい"></svg></div>
<div id="view">
<div class="bubble" id="bubble" aria-live="polite"></div>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<div class="prow" id="pts"></div>
<div id="list"></div>
<div id="bonus"></div>
<div id="rewards"></div>
<div id="brewards"></div>
<p class="foot" id="foot"></p>
</div>
<div id="parent" style="display:none"></div>
</div>
<div class="cele" id="cele"><div class="celecard"><svg id="celechr" viewBox="-64 -84 128 154" aria-hidden="true"></svg><b>ミッション クリア！</b><small id="celesub">きょうも よく がんばったね</small><div class="cpt" id="cpt"></div></div></div>
<canvas id="cf" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
var DN=['日','月','火','水','木','金','土'];
var ORDER=[1,2,3,4,5,6,0];
// 保存キーは「このアプリ固有の名前」＋「このページの場所(パス)」で分けます。同じiPadで別の予定アプリを開いても、記録が混ざりません。
// ※ すでに使っている記録を引き継ぐため、このキー名は変えないでください。
var NS=location.pathname.replace(/index\.html$/,'').replace(/\/?$/,'/');
var KEY='kids-schedule-son-v1:'+NS,PKEY='kids-plans-son-v1:'+NS;
var OLDKEY='kids-schedule-v2',OLDPKEY='kids-plans-cache-v1';
// 旧バージョン（場所を区別しない保存キー）のデータを、この場所の保存キーへ一度だけ引き継ぎます。
// このアプリは他のアプリとは別なので false にしています（別アプリの旧データを持ち込まないため）。

function pad(n){return String(n).padStart(2,'0');}
function fmt(m){return Math.floor(m/60)+':'+pad(Math.round(m%60));}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function iso(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
function weekDate(d){var n=new Date();var mon=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7));return iso(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+((d+6)%7)));}

function hm(v){var m=/^(\d{1,2}):(\d{2})$/.exec(String(v||''));if(!m)return NaN;var h=parseInt(m[1],10),mi=parseInt(m[2],10);if(h>24||mi>59||(h===24&&mi>0))return NaN;return h*60+mi;}

function normS(o){
if(!o.done||typeof o.done!=='object')o.done={};
if(!o.pts||typeof o.pts!=='object')o.pts={log:{},adj:0};
if(!o.pts.log||typeof o.pts.log!=='object')o.pts.log={};
if(typeof o.pts.adj!=='number')o.pts.adj=0;
if(!o.claimed||typeof o.claimed!=='object')o.claimed={};
o.mute=!!o.mute;
if(!Array.isArray(o.out))o.out=[];
if(typeof o.cursor!=='number')o.cursor=0;
if(!o.tm||typeof o.tm!=='object')o.tm={};
if(!o.adjE||typeof o.adjE!=='object')o.adjE={};
if(!o.dev||typeof o.dev!=='string')o.dev='d'+Math.random().toString(36).slice(2,8);
if(!o.sync||typeof o.sync!=='object')o.sync={};
if(!o.bdone||typeof o.bdone!=='object')o.bdone={};
if(typeof o.badj!=='number')o.badj=0;
if(!o.badjE||typeof o.badjE!=='object')o.badjE={};
if(!o.bclaimed||typeof o.bclaimed!=='object')o.bclaimed={};
var cut=new Date();cut.setDate(cut.getDate()-150);var cs=iso(cut);
Object.keys(o.done).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&k<cs)delete o.done[k];});
Object.keys(o.bdone).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&k<cs)delete o.bdone[k];});
Object.keys(o.tm).forEach(function(k){var q=k.split('|')[1];if(/^\d{4}-\d{2}-\d{2}$/.test(q||'')&&q<cs)delete o.tm[k];});
return o;
}

function parsePlans(o){

out.version=o.version||0;out.updatedAt=o.updatedAt?String(o.updatedAt):'';
function day(entry,label,dow){
if(!entry||!Array.isArray(entry.tasks)){errs.push(label+'：tasks がありません');return null;}
var r=(dow===0||dow===6)?[420,1260]:[900,1260];
if(entry.range){var a=hm(entry.range[0]),b=hm(entry.range[1]);if(isNaN(a)||isNaN(b)||b<=a){errs.push(label+'：range が正しくありません');}else{r=[a,b];}}
var tasks=[],seen={};
entry.tasks.forEach(function(t,i){
var id=String(t&&t.id!=null?t.id:''),nm=t&&t.name,s=hm(t&&t.start),e=hm(t&&t.end);
if(!id||!nm){errs.push(label+'：'+(i+1)+'件目に id と name が必要です');return;}
if(seen[id]){errs.push(label+'：id「'+id+'」が重複しています');return;}
seen[id]=1;
if(isNaN(s)||isNaN(e)||e<=s){errs.push(label+'「'+nm+'」：start/end が正しくありません');return;}
if(s<r[0]||e>r[1]){errs.push(label+'「'+nm+'」：range の外にあります');return;}
tasks.push({id:id,name:String(nm),icon:String(t.icon||'⭐'),memo:t.memo?String(t.memo):'',s:s,e:e});
});
tasks.sort(function(a,b){return a.s-b.s;});
for(var i=1;i<tasks.length;i++){if(tasks[i].s<tasks[i-1].e)errs.push(label+'：「'+tasks[i-1].name+'」と「'+tasks[i].name+'」が重なっています');}
return {range:r,tasks:tasks};
}
for(var d=0;d<7;d++){

var w=day(o.overrides[k],k,dow);if(w)out.overrides[k]=w;
});
}
if(Array.isArray(o.rewards)){

o.rewards.forEach(function(r,i){

rs[id]=1;

out.rewards.push({id:id,pts:p,name:String(r.name),icon:String(r.icon||'🎁')});
});
}
function bonusItems(arr,label){
var seen={},list=[];
arr.forEach(function(b,i){

if(!id||!b||!b.name){errs.push(label+'：'+(i+1)+'件目に id と name が必要です');return;}
if(seen[id]){errs.push(label+'：id「'+id+'」が重複しています');return;}

list.push({id:id,name:String(b.name),icon:String(b.icon||'✨'),memo:b.memo?String(b.memo):'',pts:p});
});
return list;
}
if(o.bonusDaily!==undefined){
if(Array.isArray(o.bonusDaily)){out.bonusDaily=bonusItems(o.bonusDaily,'bonusDaily');}else{errs.push('bonusDaily：配列で書いてください');}

if(o.bonus&&typeof o.bonus==='object'){
Object.keys(o.bonus).forEach(function(k){

var arr=o.bonus[k];if(!Array.isArray(arr)){errs.push('bonus '+k+'：配列で書いてください');return;}
var list=bonusItems(arr,'bonus '+k),dup={};

out.bonus[k]=list;
});
}
out.bonusRewardsRepeat=!!o.bonusRewardsRepeat;

o.bonusRewards.forEach(function(r,i){

out.bonusRewards.push({id:id,pts:p,name:String(r.name),icon:String(r.icon||'🎁')});
});
}
return {plans:out,errs:errs};
}

S.tm[mkey(e)]=t;

function applyEvent(e){
if(!e||typeof e.id!=='string'||typeof e.k!=='string')return false;
var v=Number(e.v);
if(e.k==='adj'){if(S.adjE[e.id]!==undefined)return false;S.adjE[e.id]=v;S.pts.adj=(S.pts.adj||0)+v;return true;}
if(e.k==='badj'){if(S.badjE[e.id]!==undefined)return false;S.badjE[e.id]=v;S.badj=(S.badj||0)+v;return true;}
var key=mkey(e),t=Number(e.t)||0;
if(S.tm[key]!==undefined&&S.tm[key]>t)return false;
S.tm[key]=t;

var p=ps[j];p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.vx*=0.99;p.r+=p.vr;
cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,1-el/3600);
if(p.k===0){cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);}
else if(p.k===1){cx.beginPath();cx.arc(0,0,p.s/2,0,Math.PI*2);cx.fill();}
else{cx.font=(p.s*2)+'px sans-serif';cx.textAlign='center';cx.fillText('★',0,p.s/2);}
cx.restore();
}
if(el<3600){requestAnimationFrame(fr);}else{cx.clearRect(0,0,w,h);}
}
requestAnimationFrame(fr);
}
var toastT=null;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2600);}
var celeT=null;
function celebrate(info){
$('celechr').innerHTML='<g>'+chr(view,'big','c')+'</g>';
$('celesub').textContent=HERO[view].nm+'ヒーローと やりきったね！';
var ch='';
if(info&&info.gained){ch='<span class="cp1">⭐ ＋1 ポイント！</span><span>ぜんぶで '+info.total+' ポイント</span>';}
else{ch='<span>きょうの ポイントは もう もらっているよ</span>';}
if(info&&info.unlocked){for(var u=0;u<info.unlocked.length;u++){ch+='<span class="cp2">'+esc(info.unlocked[u].icon)+' 「'+esc(info.unlocked[u].name)+'」 ゲット！</span>';}}
$('cpt').innerHTML=ch;
$('cele').classList.add('on');sfx('fan');confetti();
clearTimeout(celeT);celeT=setTimeout(function(){$('cele').classList.remove('on');},5000);
}
function jump(){var c=$('chr');if(!c)return;c.classList.remove('jump');void c.getBoundingClientRect();c.classList.add('jump');}

function toggle(id,x,y){
if(view!==todayIdx()){toast('その ひに なったら おしてね');return;}
var set=doneSet(view),i=set.indexOf(id),info=null;
if(i>=0){set.splice(i,1);sfx('un');emit('done',weekDate(view),id,0,nameFor(weekDate(view),id));}
else{
set.push(id);sfx('pop');burst(x,y);emit('done',weekDate(view),id,1,nameFor(weekDate(view),id));
var st0=stats();
if(st0.P.length&&st0.n===st0.P.length){
info={gained:false,total:total(),unlocked:[]};
var dk=weekDate(view);
if(!S.pts.log[dk]){var bf=total();S.pts.log[dk]=1;emit('award',dk,'',1,'');var af=total();info={gained:true,total:af,unlocked:PL.rewards.filter(function(r){return r.pts>bf&&r.pts<=af;})};}
}
}
save();renderAll();
if(i<0){jump();if(info){setTimeout(function(){celebrate(info);},350);}}
}

$('tabs').addEventListener('click',function(e){
var b=e.target.closest('.tab');if(!b)return;
view=parseInt(b.getAttribute('data-d'),10);
parent=false;renderAll();
});
$('list').addEventListener('click',function(e){var b=e.target.closest('.task');if(!b)return;toggle(b.getAttribute('data-id'),e.clientX,e.clientY);});
$('ring').addEventListener('click',function(e){var p=e.target.closest('.sg');if(!p)return;toggle(p.getAttribute('data-id'),e.clientX,e.clientY);});
$('mute').addEventListener('click',function(){S.mute=!S.mute;save();renderHeader();if(!S.mute)sfx('pop');});
$('cele').addEventListener('click',function(){$('cele').classList.remove('on');});


var lastMin=-1,lastDay=todayIdx(),lastFetch=Date.now();
setInterval(function(){
var td=todayIdx();if(td!==lastDay){lastDay=td;view=td;parent=false;renderAll();}
var m=Math.floor(nowMin());
if(m!==lastMin){lastMin=m;if(!parent){renderRing();renderStatus();renderList();}renderHeader();}
if(Date.now()-lastFetch>600000){lastFetch=Date.now();refresh(false);}
if(cfgOk()&&document.visibilityState==='visible'&&Date.now()-lastSyncTry>120000){sync(false);}
},15000);
window.addEventListener('online',function(){sync(false);});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){lastFetch=Date.now();refresh(false);sync(false);}});
if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');var onMq=function(){renderAll();};if(mq.addEventListener){mq.addEventListener('change',onMq);}else if(mq.addListener){mq.addListener(onMq);}}
renderAll();
lastMin=Math.floor(nowMin());
refresh(false);
sync(false);
})();
